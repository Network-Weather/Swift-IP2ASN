name: Publish IP2ASN Database

# Publishes a commit's bundled database and manifest to R2 and verifies them
# through pkgs.networkweather.com. Called by update-database.yml after it
# merges; dispatch it by hand to publish main or to roll back to an earlier
# commit's pair.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag whose database to publish
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-database
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Publish to R2 and verify through the CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" ]]; then
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ENDPOINT secrets are required; nothing was published."
            exit 1
          fi
          Scripts/publish-database.sh publish
